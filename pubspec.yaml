name: rosalada_project_board_ease
description: "BoardEase: boarding house management and room reservations."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.1.0
  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^5.2.0
  firebase_auth: ^7.1.0
  cloud_firestore: ^7.2.0

  # State, networking, media, and storage
  provider: ^6.1.5+1
  http: ^1.6.0
  image_picker: ^1.2.4
  flutter_image_compress: ^2.5.1
  cached_network_image: ^4.0.7
  flutter_secure_storage: ^11.2.0

  # UI and formatting
  lottie: ^3.8.2
  intl: ^0.20.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
